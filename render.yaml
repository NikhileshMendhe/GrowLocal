services:
  - type: web
    name: growlocal-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node services/api/src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: GROWLOCAL_ADMIN_EMAIL
        value: growlocal.ngp@gmail.com
